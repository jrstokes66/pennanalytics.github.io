"fomc": [{"date": "2025-05-28", "label": "May 2025"}, {"date": "2025-06-18", "label": "Jun 2025"}, {"date": "2025-07-30", "label": "Jul 2025"}, {"date": "2025-09-17", "label": "Sep 2025"}, {"date": "2025-10-29", "label": "Oct 2025"}, {"date": "2025-12-10", "label": "Dec 2025"}, {"date": "2026-01-29", "label": "Jan 2026"}, {"date": "2026-03-19", "label": "Mar 2026"}, {"date": "2026-05-07", "label": "May 2026"}],
"iran": {"date": "2026-03-04", "label": "Iran conflict"}};

const data = RAW.data;
const fomc = RAW.fomc;
const iranDate = RAW.iran.date;
const N = data.length;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// Layout
const PAD = { l: 62, r: 30, t: 18, b: 50 };
const W = canvas.width - PAD.l - PAD.r;
const H = canvas.height - PAD.t - PAD.b;

const xMin = 300, xMax = 386;
const yMin = -0.05, yMax = 1.92;

function toCanvasX(v) { return PAD.l + (v - xMin) / (xMax - xMin) * W; }
function toCanvasY(v) { return PAD.t + H - (v - yMin) / (yMax - yMin) * H; }

// Colour scale: dark blue → purple → red
function getColor(t) {
  const stops = [
    [0.00, [8,  48,  107]],
    [0.35, [106, 13, 173]],
    [1.00, [255,  0,   0]],
  ];
  let i = 0;
  while (i < stops.length - 2 && t > stops[i+1][0]) i++;
  const [t0, c0] = stops[i];
  const [t1, c1] = stops[i+1];
  const f = (t - t0) / (t1 - t0);
  const r = Math.round(c0[0] + f*(c1[0]-c0[0]));
  const g = Math.round(c0[1] + f*(c1[1]-c0[1]));
  const b = Math.round(c0[2] + f*(c1[2]-c0[2]));
  return `rgb(${r},${g},${b})`;
}

// Map FOMC dates to indices
function findIdx(dateStr) {
  let best = 0, bestDiff = Infinity;
  data.forEach((d,i) => {
    const diff = Math.abs(new Date(d.date) - new Date(dateStr));
    if (diff < bestDiff) { bestDiff = diff; best = i; }
  });
  return best;
}
const fomcIndices = fomc.map(f => ({ idx: findIdx(f.date), label: f.label }));
const iranIdx = findIdx(iranDate);

let frame = 0;
let playing = false;
let animId = null;
let lastTime = null;
let frameAccum = 0;

function drawAxes() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#f9f9f9';
  ctx.fillRect(PAD.l, PAD.t, W, H);

  // Grid
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;
  for (let v = 310; v <= 380; v += 10) {
    const cx = toCanvasX(v);
    ctx.beginPath(); ctx.moveTo(cx, PAD.t); ctx.lineTo(cx, PAD.t+H); ctx.stroke();
  }
  for (let v = 0; v <= 1.8; v += 0.2) {
    const cy = toCanvasY(v);
    ctx.beginPath(); ctx.moveTo(PAD.l, cy); ctx.lineTo(PAD.l+W, cy); ctx.stroke();
  }

  // Axes
  ctx.strokeStyle = '#888'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(PAD.l, PAD.t); ctx.lineTo(PAD.l, PAD.t+H); ctx.lineTo(PAD.l+W, PAD.t+H); ctx.stroke();

  // X ticks & labels
  ctx.fillStyle = '#444'; ctx.font = '11px Arial'; ctx.textAlign = 'center';
  for (let v = 300; v <= 380; v += 10) {
    const cx = toCanvasX(v);
    ctx.beginPath(); ctx.moveTo(cx, PAD.t+H); ctx.lineTo(cx, PAD.t+H+4); ctx.stroke();
    ctx.fillText(v.toFixed(0), cx, PAD.t+H+15);
  }

  // Y ticks & labels
  ctx.textAlign = 'right';
  for (let v = 0; v <= 1.8; v += 0.2) {
    const cy = toCanvasY(v);
    ctx.beginPath(); ctx.moveTo(PAD.l, cy); ctx.lineTo(PAD.l-4, cy); ctx.stroke();
    ctx.fillText(v.toFixed(1), PAD.l-7, cy+4);
  }

  // Axis labels
  ctx.fillStyle = '#333'; ctx.font = 'bold 12px Arial'; ctx.textAlign = 'center';
  ctx.fillText('June 2026 Expected Fed Funds Rate (bp)', PAD.l + W/2, canvas.height - 6);

  ctx.save();
  ctx.translate(14, PAD.t + H/2);
  ctx.rotate(-Math.PI/2);
  ctx.fillText('Uncertainty (entropy, nats)', 0, 0);
  ctx.restore();

  // Legend
  const lx = PAD.l + 10, ly = PAD.t + H - 50;
  ctx.fillStyle = 'rgba(255,255,255,0.88)';
  ctx.fillRect(lx-4, ly-14, 175, 44);
  ctx.strokeStyle='#ccc'; ctx.lineWidth=0.8;
  ctx.strokeRect(lx-4, ly-14, 175, 44);

  // FOMC star
  drawStar(ctx, lx+8, ly, 6, 'goldenrod', 'black');
  ctx.fillStyle='#222'; ctx.font='11px Arial'; ctx.textAlign='left';
  ctx.fillText('FOMC meeting', lx+18, ly+4);

  // Explosion
  drawExplosion(ctx, lx+8, ly+22, 10);
  ctx.fillStyle='#222'; ctx.font='11px Arial'; ctx.textAlign='left';
  ctx.fillText('Iran conflict outbreak', lx+18, ly+26);
}

function drawStar(ctx, x, y, r, fill, stroke) {
  ctx.save();
  ctx.beginPath();
  for (let i=0; i<10; i++) {
    const angle = (i * Math.PI/5) - Math.PI/2;
    const rad = i%2===0 ? r : r*0.45;
    ctx.lineTo(x + rad*Math.cos(angle), y + rad*Math.sin(angle));
  }
  ctx.closePath();
  ctx.fillStyle = fill;
  ctx.fill();
  if (stroke) { ctx.strokeStyle=stroke; ctx.lineWidth=0.5; ctx.stroke(); }
  ctx.restore();
}

function drawExplosion(ctx, x, y, r) {
  // Outer red burst
  ctx.save();
  ctx.beginPath();
  for (let i=0; i<24; i++) {
    const angle = (i * Math.PI/12) - Math.PI/2;
    const rad = i%2===0 ? r : r*0.45;
    ctx.lineTo(x + rad*Math.cos(angle), y + rad*Math.sin(angle));
  }
  ctx.closePath(); ctx.fillStyle='red'; ctx.fill();

  // Inner orange
  ctx.beginPath();
  for (let i=0; i<24; i++) {
    const angle = (i * Math.PI/12) - Math.PI/2;
    const rad = i%2===0 ? r*0.65 : r*0.3;
    ctx.lineTo(x + rad*Math.cos(angle), y + rad*Math.sin(angle));
  }
  ctx.closePath(); ctx.fillStyle='orange'; ctx.fill();

  // Yellow centre
  ctx.beginPath(); ctx.arc(x, y, r*0.22, 0, Math.PI*2);
  ctx.fillStyle='yellow'; ctx.fill();
  ctx.restore();
}

function render(upTo) {
  drawAxes();

  // Draw faded full path first
  ctx.globalAlpha = 0.12;
  ctx.lineWidth = 1.5;
  for (let i=1; i<N; i++) {
    const t = i/(N-1);
    ctx.strokeStyle = getColor(t);
    ctx.beginPath();
    ctx.moveTo(toCanvasX(data[i-1].e_ff), toCanvasY(data[i-1].entropy));
    ctx.lineTo(toCanvasX(data[i].e_ff), toCanvasY(data[i].entropy));
    ctx.stroke();
  }
  ctx.globalAlpha = 1.0;

  // Draw active path
  ctx.lineWidth = 2.2;
  for (let i=1; i<=upTo && i<N; i++) {
    const t = i/(N-1);
    ctx.strokeStyle = getColor(t);
    ctx.beginPath();
    ctx.moveTo(toCanvasX(data[i-1].e_ff), toCanvasY(data[i-1].entropy));
    ctx.lineTo(toCanvasX(data[i].e_ff), toCanvasY(data[i].entropy));
    ctx.stroke();
  }

  // Draw dots up to upTo
  for (let i=0; i<=upTo && i<N; i++) {
    const t = i/(N-1);
    ctx.fillStyle = getColor(t);
    ctx.beginPath();
    ctx.arc(toCanvasX(data[i].e_ff), toCanvasY(data[i].entropy), 3, 0, Math.PI*2);
    ctx.fill();
  }

  // FOMC stars (show if index reached)
  fomcIndices.forEach(({idx, label}) => {
    if (idx <= upTo) {
      const px = toCanvasX(data[idx].e_ff);
      const py = toCanvasY(data[idx].entropy);
      drawStar(ctx, px, py, 7, 'goldenrod', 'black');
      // label
      ctx.fillStyle = '#222'; ctx.font = '9px Arial';
      ctx.textAlign = 'left';
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      const tw = ctx.measureText(label).width;
      ctx.fillRect(px+5, py-9, tw+4, 12);
      ctx.fillStyle = '#222';
      ctx.fillText(label, px+7, py+1);
    }
  });

  // Iran explosion
  if (iranIdx <= upTo) {
    const px = toCanvasX(data[iranIdx].e_ff);
    const py = toCanvasY(data[iranIdx].entropy);
    drawExplosion(ctx, px, py, 13);
    ctx.fillStyle = '#222'; ctx.font = '9px Arial'; ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.fillRect(px+8, py-18, 60, 22);
    ctx.fillStyle = 'darkred';
    ctx.fillText('Iran', px+10, py-8);
    ctx.fillText('conflict', px+10, py+2);
  }

  // Moving dot (current position)
  if (upTo < N) {
    const px = toCanvasX(data[upTo].e_ff);
    const py = toCanvasY(data[upTo].entropy);
    ctx.beginPath(); ctx.arc(px, py, 5, 0, Math.PI*2);
    ctx.fillStyle = 'white'; ctx.fill();
    ctx.strokeStyle = '#333'; ctx.lineWidth = 1.5; ctx.stroke();
  }

  // Date display on chart
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.fillRect(PAD.l+W-88, PAD.t+4, 84, 18);
  ctx.fillStyle = '#333'; ctx.font = 'bold 12px Arial'; ctx.textAlign = 'center';
  ctx.fillText(data[Math.min(upTo,N-1)].date, PAD.l+W-46, PAD.t+16);
}

// Scrubber
const scrub = document.getElementById('scrub');
scrub.max = N-1;
scrub.addEventListener('input', () => {
  frame = parseInt(scrub.value);
  document.getElementById('dateLabel').textContent = data[frame].date;
  render(frame);
  if (playing) { cancelAnimationFrame(animId); playing=false; document.getElementById('btnPlay').textContent='▶ Play'; }
});

// Speed
const speedSlider = document.getElementById('speed');
const speedVal = document.getElementById('speedVal');
speedSlider.addEventListener('input', () => { speedVal.textContent = speedSlider.value; });

function animate(ts) {
  if (!lastTime) lastTime = ts;
  const dt = ts - lastTime;
  lastTime = ts;
  const spd = parseInt(speedSlider.value);
  frameAccum += dt * spd * 0.008;
  while (frameAccum >= 1) { frame++; frameAccum--; }
  if (frame >= N) {
    frame = N-1;
    playing = false;
    document.getElementById('btnPlay').textContent = '▶ Play';
  }
  scrub.value = frame;
  document.getElementById('dateLabel').textContent = data[frame].date;
  render(frame);
  if (playing) animId = requestAnimationFrame(animate);
}

document.getElementById('btnPlay').addEventListener('click', () => {
  if (playing) {
    playing = false;
    cancelAnimationFrame(animId);
    document.getElementById('btnPlay').textContent = '▶ Play';
  } else {
    if (frame >= N-1) frame = 0;
    playing = true;
    lastTime = null; frameAccum = 0;
    document.getElementById('btnPlay').textContent = '⏸ Pause';
    animId = requestAnimationFrame(animate);
  }
});

document.getElementById('btnReset').addEventListener('click', () => {
  playing = false;
  cancelAnimationFrame(animId);
  frame = 0;
  scrub.value = 0;
  document.getElementById('dateLabel').textContent = data[0].date;
  document.getElementById('btnPlay').textContent = '▶ Play';
  render(0);
});

// Initial draw
render(0);
</script>
